<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">One source changes. Its linked claim needs another look.</title><desc id="desc">Actual fictional demo: same Git commit returns UNCHANGED and no affected claims; appending a five-day amendment returns RECHECK_REQUIRED for claim-routine only.</desc><defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#142941"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7bd9d0"/></marker></defs><rect width="1200" height="560" rx="24" fill="url(#sky)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="54" font-size="31" font-weight="700" fill="#f7fafc">One source changes. Its linked claim needs another look.</text><text x="32" y="87" font-size="18" fill="#b9cadd">Existing fictional demo · real temporary Git commits · Node.js 24.22.1</text>
<rect x="32" y="124" width="510" height="142" rx="16" fill="#172b42" stroke="#40546b"/>
<text x="52" y="156" font-size="14" fill="#7bd9d0">FIRST COMPARISON</text>
<text x="52" y="195" font-size="25" fill="#fff" font-weight="700">Baseline ↔ same commit</text>
<text x="52" y="231" font-size="19" fill="#b9cadd">Two recorded sources. Two linked claims.</text>
<path d="M555 195H635" fill="none" stroke="#7bd9d0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="658" y="124" width="510" height="142" rx="16" fill="#173d42" stroke="#68c2b7"/>
<text x="680" y="164" font-size="26" fill="#b6efe5" font-weight="700">UNCHANGED</text>
<text x="680" y="205" font-size="21" fill="#fff">affected_claims: []</text>
<text x="680" y="239" font-size="17" fill="#c5dfde">Same recorded evidence at both revisions.</text>
<rect x="32" y="293" width="510" height="157" rx="16" fill="#172b42" stroke="#40546b"/>
<text x="52" y="326" font-size="14" fill="#f2d58d">SECOND COMPARISON</text>
<text x="52" y="363" font-size="25" fill="#fff" font-weight="700">Amend the fictional policy</text>
<text x="52" y="397" font-size="19" fill="#b9cadd">Existing text: seven-day review target.</text>
<text x="52" y="429" font-size="19" fill="#f2d58d">Append: the target is now five days.</text>
<path d="M555 372H635" fill="none" stroke="#7bd9d0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="658" y="293" width="510" height="157" rx="16" fill="#3a3540" stroke="#bda268"/>
<text x="680" y="335" font-size="26" fill="#f2d58d" font-weight="700">RECHECK_REQUIRED</text>
<text x="680" y="376" font-size="21" fill="#fff">Affected: claim-routine</text>
<text x="680" y="413" font-size="18" fill="#e4d4b3">claim-specialist is not flagged.</text>
<text x="32" y="498" font-size="21" fill="#b6efe5" font-weight="700">The report connects an observed file change to the claim that uses it.</text>
<text x="32" y="537" font-size="15" fill="#b9cadd">Diagram of actual CLI results. A change requests review; the reviewer decides what it means.</text>
</g></svg>
